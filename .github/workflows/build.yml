name: Build Linux release
# Fork Actions registration.
on:
  # Temporary: the integration token cannot call workflow_dispatch.
  # Removed once a run is queued. Push of this branch builds x86_64 only.
  push:
    branches:
      - cursor/fix-ci-build-cache-1e29
  workflow_dispatch:
    inputs:
      runner:
        required: false
        description: "Runner image to use"
        default: "ubuntu-latest"
      do-release:
        required: false
        type: boolean
        description: "Create a release after build is done"
        default: false
      arch:
        required: false
        description: "JSON array of architectures to build"
        default: '["arm64", "x86_64"]'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Helium binaries and AppImage
    strategy:
      matrix:
        arch: ${{ github.event_name == 'workflow_dispatch' && fromJson(inputs.arch) || fromJson('["x86_64"]') }}
      max-parallel: 2
      fail-fast: true
    uses: ./.github/workflows/build-steps.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      runs-on: ${{ inputs.runner }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.do-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
